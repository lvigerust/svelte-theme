name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # The browser tests run in Chromium through Playwright.
      - run: vp exec playwright install --with-deps chromium

      - run: vp run ready
